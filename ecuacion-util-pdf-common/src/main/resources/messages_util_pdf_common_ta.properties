jp.ecuacion.util.pdf.common.SystemFontNotFound.message.default=கணினி எழுத்துரு கிடைக்கவில்லை: {0}. எழுத்துருவை நிறுவவும், அல்லது PdfGenerateOptions இல் addRegularFontPath()/addFallbackFont() மூலம் மாற்று எழுத்துருவைப் பதிவு செய்யவும்
jp.ecuacion.util.pdf.common.FontLoadFailed.message.default=எழுத்துருக் கோப்பிலிருந்து எழுத்துருவை ஏற்ற முடியவில்லை (எழுத்துருப் பெயர்: {0}, எழுத்துருக் கோப்பு: {1})
jp.ecuacion.util.pdf.common.CharacterNotRenderable.message.default=ஒரு எழுத்தை வரைய முடியவில்லை. அமைக்கப்பட்ட எந்த எழுத்துருவிலும் இதற்கான கிளிஃப் இல்லை. (எழுத்து: U+{0} ({1}), முதன்மை எழுத்துரு: {2}, முயற்சித்த மாற்று எழுத்துருக்கள்: {3}) PdfGenerateOptions மூலம் இந்த எழுத்தை உள்ளடக்கிய எழுத்துருவைச் சேர்க்கவும்
jp.ecuacion.util.pdf.common.FileFormatNotSupported.message.default=கோப்பின் வடிவம் ஆதரிக்கப்படவில்லை (ஆதரிக்கப்படும் வடிவங்கள்: {0})
jp.ecuacion.util.pdf.common.FilePasswordRequired.message.default=கோப்பு கடவுச்சொல்லால் பாதுகாக்கப்பட்டுள்ளது. கோப்பின் கடவுச்சொல்லைக் குறிப்பிடவும்
jp.ecuacion.util.pdf.common.FilePasswordIncorrect.message.default=கோப்பின் கடவுச்சொல் தவறானது
