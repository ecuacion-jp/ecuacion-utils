jp.ecuacion.util.pdf.common.CharacterNotRenderable.message.default=ಒಂದು ಅಕ್ಷರವನ್ನು ಪ್ರದರ್ಶಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ. ಕಾನ್ಫಿಗರ್ ಮಾಡಿದ ಯಾವುದೇ ಫಾಂಟ್ನಲ್ಲಿ ಇದರ ಗ್ಲಿಫ್ ಇಲ್ಲ. (ಅಕ್ಷರ: U+{0} ({1}), ಪ್ರಾಥಮಿಕ ಫಾಂಟ್: {2}, ಪ್ರಯತ್ನಿಸಿದ ಪರ್ಯಾಯ ಫಾಂಟ್ಗಳು: {3}) PdfGenerateOptions ಮೂಲಕ ಈ ಅಕ್ಷರವನ್ನು ಒಳಗೊಂಡಿರುವ ಫಾಂಟ್ ಅನ್ನು ಸೇರಿಸಿ
jp.ecuacion.util.pdf.common.FileFormatNotSupported.message.default=ಫೈಲ್‌ನ ಫಾರ್ಮ್ಯಾಟ್ ಬೆಂಬಲಿತವಾಗಿಲ್ಲ (ಬೆಂಬಲಿತ ಫಾರ್ಮ್ಯಾಟ್‌ಗಳು: {0})
