jp.ecuacion.util.pdf.common.SystemFontNotFound.message.default=ಸಿಸ್ಟಮ್ ಫಾಂಟ್ ಕಂಡುಬಂದಿಲ್ಲ: {0}. ಫಾಂಟ್ ಅನ್ನು ಸ್ಥಾಪಿಸಿ, ಅಥವಾ PdfGenerateOptions ನಲ್ಲಿನ addRegularFontPath()/addFallbackFont() ಮೂಲಕ ಪರ್ಯಾಯ ಫಾಂಟ್ ಅನ್ನು ನೋಂದಾಯಿಸಿ
