jp.ecuacion.util.pdf.common.CharacterNotRenderable.message.default=एक वर्ण रेंडर नहीं किया जा सकता। किसी भी कॉन्फ़िगर किए गए फ़ॉन्ट में इसका ग्लिफ़ नहीं है। (वर्ण: U+{0} ({1}), प्राथमिक फ़ॉन्ट: {2}, आज़माए गए फ़ॉलबैक फ़ॉन्ट: {3}) PdfGenerateOptions के माध्यम से इस वर्ण को कवर करने वाला फ़ॉन्ट जोड़ें
