jp.ecuacion.util.pdf.excel.report.SheetNotExist.message.default=Excel ಫೈಲ್ನಲ್ಲಿ ನಿರ್ದಿಷ್ಟಪಡಿಸಿದ ಶೀಟ್ ಇಲ್ಲ (ಶೀಟ್ ಹೆಸರು: {0})
jp.ecuacion.util.pdf.excel.report.SheetHasNoPrintArea.message.default=ಶೀಟ್ನಲ್ಲಿ ಮುದ್ರಣ ಪ್ರದೇಶವೂ ಇಲ್ಲ, ಡೇಟಾವೂ ಇಲ್ಲ (ಶೀಟ್ ಹೆಸರು: {0})
jp.ecuacion.util.pdf.excel.report.SystemFontNotFound.message.default=ಸಿಸ್ಟಮ್ ಫಾಂಟ್ ಕಂಡುಬಂದಿಲ್ಲ: {0}. ಫಾಂಟ್ ಅನ್ನು ಸ್ಥಾಪಿಸಿ, ಅಥವಾ PdfGenerateOptions ನಲ್ಲಿನ addRegularFontPath()/addFallbackFont() ಮೂಲಕ ಪರ್ಯಾಯ ಫಾಂಟ್ ಅನ್ನು ನೋಂದಾಯಿಸಿ
jp.ecuacion.util.pdf.excel.report.FontLoadFailed.message.default=ಫಾಂಟ್ ಫೈಲ್ನಿಂದ ಫಾಂಟ್ ಲೋಡ್ ಮಾಡಲು ವಿಫಲವಾಗಿದೆ (ಫಾಂಟ್ ಹೆಸರು: {0}, ಫಾಂಟ್ ಫೈಲ್: {1})
jp.ecuacion.util.pdf.excel.report.CharacterNotRenderable.message.default=ಒಂದು ಅಕ್ಷರವನ್ನು ಪ್ರದರ್ಶಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ. ಕಾನ್ಫಿಗರ್ ಮಾಡಿದ ಯಾವುದೇ ಫಾಂಟ್ನಲ್ಲಿ ಇದರ ಗ್ಲಿಫ್ ಇಲ್ಲ. (ಅಕ್ಷರ: U+{0} ({1}), ಪ್ರಾಥಮಿಕ ಫಾಂಟ್: {2}, ಪ್ರಯತ್ನಿಸಿದ ಪರ್ಯಾಯ ಫಾಂಟ್ಗಳು: {3}) PdfGenerateOptions ಮೂಲಕ ಈ ಅಕ್ಷರವನ್ನು ಒಳಗೊಂಡಿರುವ ಫಾಂಟ್ ಅನ್ನು ಸೇರಿಸಿ
