jp.ecuacion.util.pdf.excel.report.SheetNotExist.message.default=Excel கோப்பில் குறிப்பிட்ட தாள் இல்லை (தாள் பெயர்: {0})
jp.ecuacion.util.pdf.excel.report.SheetHasNoPrintArea.message.default=தாளில் அச்சுப் பகுதியும் இல்லை, தரவும் இல்லை (தாள் பெயர்: {0})
jp.ecuacion.util.pdf.excel.report.SystemFontNotFound.message.default=கணினி எழுத்துரு கிடைக்கவில்லை: {0}. எழுத்துருவை நிறுவவும், அல்லது PdfGenerateOptions இல் addRegularFontPath()/addFallbackFont() மூலம் மாற்று எழுத்துருவைப் பதிவு செய்யவும்
jp.ecuacion.util.pdf.excel.report.FontLoadFailed.message.default=எழுத்துருக் கோப்பிலிருந்து எழுத்துருவை ஏற்ற முடியவில்லை (எழுத்துருப் பெயர்: {0}, எழுத்துருக் கோப்பு: {1})
jp.ecuacion.util.pdf.excel.report.CharacterNotRenderable.message.default=ஒரு எழுத்தை வரைய முடியவில்லை. அமைக்கப்பட்ட எந்த எழுத்துருவிலும் இதற்கான கிளிஃப் இல்லை. (எழுத்து: U+{0} ({1}), முதன்மை எழுத்துரு: {2}, முயற்சித்த மாற்று எழுத்துருக்கள்: {3}) PdfGenerateOptions மூலம் இந்த எழுத்தை உள்ளடக்கிய எழுத்துருவைச் சேர்க்கவும்
