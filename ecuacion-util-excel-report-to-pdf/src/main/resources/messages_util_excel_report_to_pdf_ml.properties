jp.ecuacion.util.pdf.excel.report.SheetNotExist.message.default=Excel ഫയലിൽ വ്യക്തമാക്കിയ ഷീറ്റ് ഇല്ല (ഷീറ്റിന്റെ പേര്: {0})
jp.ecuacion.util.pdf.excel.report.SheetHasNoPrintArea.message.default=ഷീറ്റിൽ പ്രിന്റ് ഏരിയയോ ഡാറ്റയോ ഇല്ല (ഷീറ്റിന്റെ പേര്: {0})
jp.ecuacion.util.pdf.excel.report.SystemFontNotFound.message.default=സിസ്റ്റം ഫോണ്ട് കണ്ടെത്തിയില്ല: {0}. ഫോണ്ട് ഇൻസ്റ്റാൾ ചെയ്യുക, അല്ലെങ്കിൽ PdfGenerateOptions-ലെ addRegularFontPath()/addFallbackFont() വഴി ഒരു പകരം ഫോണ്ട് രജിസ്റ്റർ ചെയ്യുക
jp.ecuacion.util.pdf.excel.report.FontLoadFailed.message.default=ഫോണ്ട് ഫയലിൽ നിന്ന് ഫോണ്ട് ലോഡ് ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടു (ഫോണ്ടിന്റെ പേര്: {0}, ഫോണ്ട് ഫയൽ: {1})
jp.ecuacion.util.pdf.excel.report.CharacterNotRenderable.message.default=ഒരു അക്ഷരം റെൻഡർ ചെയ്യാൻ കഴിയില്ല. ക്രമീകരിച്ച ഒരു ഫോണ്ടിലും ഇതിന്റെ ഗ്ലിഫ് ഇല്ല. (അക്ഷരം: U+{0} ({1}), പ്രാഥമിക ഫോണ്ട്: {2}, ശ്രമിച്ച പകരം ഫോണ്ടുകൾ: {3}) PdfGenerateOptions വഴി ഈ അക്ഷരം ഉൾക്കൊള്ളുന്ന ഫോണ്ട് ചേർക്കുക
