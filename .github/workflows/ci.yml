name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

env:
  # allure.install.directory: share one Node.js/allure install across all reactor
  # modules instead of the plugin's per-module default (${project.basedir}/.allure),
  # which would otherwise re-download it for every module in the build.
  MAVEN_OPTS: -Xmx2g -Dallure.install.directory=${{ github.workspace }}/.allure-shared

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: ecuacion-utils

      - uses: actions/checkout@v5
        with:
          repository: ecuacion-jp/ecuacion-lib
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || (github.ref_name == 'main' && 'main' || 'develop') }}
          path: ecuacion-lib

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Exclude build paths from Windows Defender scanning
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.m2"
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Build ecuacion-lib
        working-directory: ecuacion-lib
        run: mvn install -DskipTests -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dlicense.skip=true -Djacoco.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dallure.report.skip=true

      - name: Validate POM after version update
        working-directory: ecuacion-utils
        run: |
          mvn versions:set -DnewVersion=0.0.0-CI-TEST -DgenerateBackupPoms=false
          mvn versions:update-parent -DgenerateBackupPoms=false
          mvn versions:update-properties -Dincludes=jp.ecuacion.lib -DgenerateBackupPoms=false
          mvn validate
          git checkout -- .

      - name: Verify (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ecuacion-utils
        run: mvn verify -Dwagon.skip=true -e

      - name: Test (windows)
        if: matrix.os == 'windows-latest'
        working-directory: ecuacion-utils
        run: mvn test -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dlicense.skip=true -Djacoco.skip=true -e

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main'))
        # Third-party action pinned to a commit SHA (tags are mutable): v5
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            ecuacion-utils/ecuacion-util-excel-table/target/site/jacoco/jacoco.xml,
            ecuacion-utils/ecuacion-util-excel-report-to-pdf/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
