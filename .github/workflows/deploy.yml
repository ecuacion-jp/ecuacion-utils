name: Build and Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. 1.0.0)'
        required: true

env:
  MAVEN_OPTS: -Xmx2g

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ecuacion-utils

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/resolve-tag@main
        id: tag

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/install-ecuacion-dependency@main
        with:
          repository: ecuacion-jp/ecuacion-lib
          path: ecuacion-lib
          extra-mvn-args: -q

      - name: Update versions
        working-directory: ecuacion-utils
        env:
          NEW_VERSION: ${{ steps.tag.outputs.value }}
        run: |
          mvn versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false
          mvn versions:update-parent -DgenerateBackupPoms=false
          mvn versions:update-properties -Dincludes=jp.ecuacion.lib -DgenerateBackupPoms=false

      - name: Verify
        working-directory: ecuacion-utils
        run: mvn verify -Dwagon.skip=true -Dallure.report.skip=true -Djacoco.skip=true -Dlicense.skip=true

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/import-gpg-key@main
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/configure-maven-central-settings@main

      - name: Deploy
        working-directory: ecuacion-utils
        run: mvn deploy -P maven-central -Dwagon.skip=true -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
